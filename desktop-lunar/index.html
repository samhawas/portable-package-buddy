  <body>
    <div id="root"></div>
  <script>
(function () {
  const installSettingsButtons = () => {
    const pdfButton = [...document.querySelectorAll('button')].find((button) =>
      button.textContent.trim() === 'تصدير إلى PDF'
    );
    if (!pdfButton || document.getElementById('miqat-settings-controls')) return !!pdfButton;

    const host = pdfButton.parentElement;
    const makeButton = (label, title, handler) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.title = title;
      button.style.cssText = [
        'border:1px solid #b99543', 'border-radius:0.75rem', 'padding:0.65rem 0.9rem',
        'background:#16202e', 'color:#f4d27a', 'font:inherit', 'font-weight:700',
        'cursor:pointer', 'white-space:nowrap'
      ].join(';');
      button.addEventListener('click', handler);
      return button;
    };

    const controls = document.createElement('span');
    controls.id = 'miqat-settings-controls';
    controls.dir = 'rtl';
    controls.style.cssText = 'display:inline-flex;flex-wrap:wrap;gap:0.5rem;margin-inline-start:0.5rem;vertical-align:middle';

    const saveSettings = async () => {
      const settings = {};
      for (let index = 0; index < localStorage.length; index += 1) {
        const key = localStorage.key(index);
        if (key !== null) settings[key] = localStorage.getItem(key);
      }
      const content = JSON.stringify({
        format: 'al-miqat-settings', version: 1, savedAt: new Date().toISOString(), settings
      }, null, 2);

      if (window.AlMiqatDesktop?.saveSettings) {
        await window.AlMiqatDesktop.saveSettings(content);
        return;
      }

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'إعدادات-الميقات.json',
            types: [{ description: 'ملف إعدادات JSON', accept: { 'application/json': ['.json'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(content);
          await writable.close();
          return;
        } catch (error) {
          if (error?.name === 'AbortError') return;
        }
      }

      const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'إعدادات-الميقات.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    };

    const restoreSettings = () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const backup = JSON.parse(String(reader.result));
            if (!backup || backup.format !== 'al-miqat-settings' ||
                !backup.settings || typeof backup.settings !== 'object') throw new Error('invalid');
            localStorage.clear();
            Object.entries(backup.settings).forEach(([key, value]) => {
              if (typeof value === 'string') localStorage.setItem(key, value);
            });
            alert('تمت استعادة الإعدادات. سيتم إعادة تحميل التطبيق.');
            location.reload();
          } catch (_) {
            alert('ملف إعدادات غير صالح.');
          }
        };
        reader.readAsText(file, 'utf-8');
      });
      input.click();
    };

    controls.append(
      makeButton('حفظ الإعدادات', 'حفظ الموقع وتعديلات المواقيت والتنبيهات وملفات الصوت وغيرها', saveSettings),
      makeButton('استعادة الإعدادات', 'استعادة الإعدادات من ملف JSON محفوظ', restoreSettings)
    );
    host.appendChild(controls);
    return true;
  };

  if (!installSettingsButtons()) {
    const observer = new MutationObserver(() => {
      if (installSettingsButtons()) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(() => observer.disconnect(), 15000);
  }
})();
</script>
<script>
(function () {
  const STORAGE_KEY = 'miqat-reminders';
  const sectionTitle = 'مواعيد';
  const getReminders = () => {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (_) { return []; }
  };
  const saveReminders = (items) => localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  const enhance = () => {
    const heading = [...document.querySelectorAll('h2')].find((node) => node.textContent.trim() === sectionTitle);
    if (!heading) return;
    const section = heading.closest('section');
    if (!section) return;
    const reminders = getReminders();
    const deleteButtons = [...section.querySelectorAll('button[aria-label="حذف الموعد"]')];
    deleteButtons.forEach((deleteButton, index) => {
      const card = deleteButton.closest('div.rounded-2xl');
      const reminder = reminders[index];
      if (!card || !reminder || card.querySelector('[data-miqat-title-field]')) return;
      const field = document.createElement('label');
      field.dataset.miqatTitleField = '1';
      field.style.cssText = 'display:flex;flex-direction:column;gap:.25rem;margin-bottom:.75rem';
      const label = document.createElement('span');
      label.textContent = 'عنوان الموعد';
      label.style.cssText = 'font-size:.75rem;color:var(--color-muted-foreground,#94a3b8)';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'اكتب عنوان الموعد للتمييز بين المواعيد';
      input.value = typeof reminder.title === 'string' ? reminder.title : '';
      input.className = 'rounded-lg border border-border bg-background px-2 py-1.5 text-sm text-foreground';
      input.addEventListener('input', () => {
        const current = getReminders();
        const item = current.find((entry) => entry.id === reminder.id);
        if (item) { item.title = input.value; saveReminders(current); }
      });
      field.append(label, input);
      card.insertBefore(field, card.firstElementChild);
    });
  };
  const observer = new MutationObserver(enhance);
  observer.observe(document.body, { childList: true, subtree: true });
  enhance();
})();
</script>
